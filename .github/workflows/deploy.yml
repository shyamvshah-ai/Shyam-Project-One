name: Build & deploy Money Explorers

# Manual verification mode: fetch real prices (Yahoo) and build, printing a
# summary so we can confirm real data before wiring the daily Pages deploy.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch real end-of-day prices (£)
        run: npm run refresh-prices
      - name: Summarise prices.json
        run: |
          node -e '
            const p = require("./src/data/prices.json");
            const tk = Object.keys(p.series);
            const last = (t) => p.series[t] ? p.series[t].at(-1) : "n/a";
            console.log("real:", p.real, "| assets:", tk.length, "| days:", p.dates.length, "| latest:", p.dates.at(-1));
            for (const t of ["AAPL","TSCO","NVDA","SP500","FTSE100","INDIA"]) console.log("  ", t, "=> £" + last(t));
          '
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE: /Shyam-Project-One/

name: Build & deploy Money Explorers

# TEMPORARY diagnostic mode: manual-only, no schedule, no deploy. We're checking
# which real price sources are reachable from GitHub's runners before wiring the
# full daily deploy back up.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate price sources
        run: |
          set +e
          probe() {
            echo "==== $1 ===="
            code=$(curl -sS -A "Mozilla/5.0" -o /tmp/out -w "%{http_code}" --max-time 20 "$2")
            echo "HTTP $code  ($(wc -c </tmp/out) bytes)"
            head -c 240 /tmp/out; echo; echo
          }
          probe "Stooq US (aapl.us)" "https://stooq.com/q/d/l/?s=aapl.us&i=d"
          probe "Yahoo chart AAPL"   "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1mo&interval=1d"
          probe "Yahoo chart TSCO.L" "https://query1.finance.yahoo.com/v8/finance/chart/TSCO.L?range=1mo&interval=1d"
          probe "Yahoo FX GBPUSD"    "https://query1.finance.yahoo.com/v8/finance/chart/GBPUSD=X?range=5d&interval=1d"
          probe "Stooq FX (usdgbp)"  "https://stooq.com/q/d/l/?s=usdgbp&i=d"
